<body>
    <div class="booking-now">
        <div class="navbar">
            <div class="nav-container">
                <div class="nav-row">
                    <div class="navbar-logo">
                        <button class="hamburger" aria-label="Toggle menu">
                            <span class="hamburger-line"></span>
                            <span class="hamburger-line"></span>
                            <span class="hamburger-line"></span>
                        </button>
                        <a href="./">
                            <img class="logo-img" src="assets/images/image-16-1.png" alt="VFO logo" />
                        </a>
                    </div>
                    <div class="navbar-nav">
                        <div class="nav-menu">
                            <div class="nav-item">
                                <a href="./" style="text-decoration: none; color: inherit;">
                                    <div class="nav-link">HOME</div>
                                </a>
                            </div>
                            <div class="nav-item">
                                <a href="about-us.html" style="text-decoration: none; color: inherit;">
                                    <div class="nav-link">ABOUT US</div>
                                </a>
                            </div>
                            <div class="nav-item">
                                <a href="our-services.html" style="text-decoration: none; color: inherit;">
                                    <div class="nav-link">OUR SERVICES</div>
                                </a>
                            </div>
                            <div class="nav-item">
                                <a href="contact-us.html" style="text-decoration: none; color: inherit;">
                                    <div class="nav-link">CONTACT US</div>
                                </a>
                            </div>
                        </div>
                        <a class="btn-book-pc" href="booking-now.html" style="text-decoration: none;">
                            <button class="nav-btn-book">
                                <div class="nav-btn-text">BOOK NOW</div>
                            </button>
                        </a>
                    </div>
                    <a class="btn-book-mb" href="booking-now.html" style="text-decoration: none;">
                        <button class="nav-btn-book">
                            <div class="nav-btn-text">BOOK NOW</div>
                        </button>
                    </a>
                </div>
            </div>
        </div>
        <section class="booking-bg-section">
            <div class="container">
                <div class="column">
                    <div class="booking-header">
                        <div class="booking-title-wrapper">
                            <div class="booking-title">BOOKING</div>
                        </div>
                        <div class="package-tabs">
                            <div class="package-tab active" data-package="basic">
                                <div class="package-tab-name">Basic Kayak <span class="pc">Experience</span></div>
                            </div>
                            <div class="package-separator">/</div>
                            <div class="package-tab" data-package="platinum">
                                <div class="package-tab-name">Platinum Fishing <span class="pc">Experience</span></div>
                            </div>
                            <div class="package-separator">/</div>
                            <div class="package-tab" data-package="platinum-elite">
                                <div class="package-tab-name">Premium Elite <span class="pc">Expedition</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="booking-section basic">
                        <div class="package-images">
                            <img class="package-img" src="assets/images/booking-1.png" />
                            <img class="package-img" src="assets/images/booking-2.jpg?v=1" />
                            <img class="package-img" src="assets/images/booking-3.jpg?v=1" />
                        </div>
                        <form class="booking-form-wrapper" id="bookingForm">
                            <div class="form-header">
                                <div class="form-package-name">Kayak Adventures</div>
                                <div class="form-price">
                                    <div class="price-amount">200</div>
                                    <div class="price-unit">USD/day</div>
                                </div>
                            </div>
                            <div class="form-header">
                                <div class="form-package-name">Platinum Fishing Experience</div>
                                <div class="form-price">
                                    <div class="price-amount">300</div>
                                    <div class="price-unit">USD/day</div>
                                </div>
                            </div>
                            <div class="form-header">
                                <div class="form-package-name">Premium Elite Expedition</div>
                                <div class="form-price">
                                    <div class="price-amount">500</div>
                                    <div class="price-unit">USD/day</div>
                                </div>
                            </div>
                            <img class="form-line" src="assets/images/line-69.svg" />
                            <div class="booking-form">
                                <div class="form-group">
                                    <label class="form-label" for="input-1">Full Name</label>
                                    <input class="form-input" placeholder="Enter your full Name" type="text"
                                        id="input-1" name="name" required />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="input-2">Email</label>
                                    <input class="form-input" placeholder="Enter your Email" type="email"
                                        id="input-2" name="email" required />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="input-3">Phone number</label>
                                    <input class="form-input" placeholder="Enter your phone number" type="tel"
                                        id="input-3" name="phone" required />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="input-4">Participation Date</label>
                                    <input class="form-input" type="date" id="input-4" name="date" required />
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label" for="input-5">Adults</label>
                                        <input class="form-input" placeholder="Number of Adults" type="number"
                                            id="input-5" name="adults" min="0" value="1" />
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="input-6">Children</label>
                                        <input class="form-input" placeholder="Number of Children" type="number"
                                            id="input-6" name="children" min="0" value="0" />
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="input-7">Special Requests / Pickup Location</label>
                                    <textarea class="form-textarea" placeholder="Special Requests / Pickup Location"
                                        id="input-7" name="message"></textarea>
                                </div>
                            </div>
                            <button class="form-btn" type="submit">
                                <div class="form-btn-text">Submit Booking Request</div>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        <footer class="footer" id="footer">
    </div>

    <script src="assets/js/booking.js"></script>
    <script src="assets/js/navigate.js"></script>
    <script src="assets/js/footer.js"></script>

</html>
